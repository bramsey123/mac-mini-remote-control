[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "macagent"
dynamic = ["version"]
description = "Run a Claude Code agent on a dedicated Mac, contained and remotely controllable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# The runtime is deliberately stdlib-only: it is installed as root and runs
# inside the security boundary, so every dependency is attack surface.
# Watcher backends declare their own extras when they land (docs/watcher.md).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
macagent = "macagent.cli:main"

[tool.setuptools.dynamic]
version = { attr = "macagent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes and ellipses in prose are intentional
